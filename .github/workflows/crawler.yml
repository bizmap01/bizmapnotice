name: Bizmap Notice Daily Crawler

on:
  schedule:
    # 🔴 매일 한국 시간 07:45 실행 (UTC 전날 22:45)
    # ※ 08:00(UTC 23:00) 글로벌 트래픽 피크를 피해 8시 전후 정시 발송 유도
    - cron: '45 22 * * *'
  workflow_dispatch: # 수동 실행(Run workflow) 버튼 유지

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 코드 체크아웃
      uses: actions/checkout@v4

    - name: 2. 파이썬 3.11 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 3. 모듈 및 Playwright 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas curl_cffi beautifulsoup4 openpyxl supabase playwright
        python -m playwright install chromium
        sudo $(which python) -m playwright install-deps

    - name: 4. 매일 아침 크롤러 및 알림톡/문자 발송 실행
      run: |
        python main.py
