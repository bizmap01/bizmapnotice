<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비즈맵(Bizmap) - 맞춤형 지원사업 카톡 알림</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Kakao SDK -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: "Pretendard", sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col justify-between">

  <!-- 헤더 -->
  <header class="w-full bg-white border-b border-gray-200 py-4 px-6 flex justify-between items-center max-w-5xl mx-auto">
    <div class="flex items-center gap-2">
      <span class="text-2xl font-black text-blue-600">Bizmap</span>
      <span class="text-xs font-bold bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">알림톡</span>
    </div>
    <button onclick="loginWithKakao()" class="text-sm font-semibold text-gray-600 hover:text-gray-900">로그인</button>
  </header>

  <!-- 메인 히어로 섹션 -->
  <main class="max-w-3xl mx-auto px-6 py-16 text-center flex-grow flex flex-col justify-center items-center">
    
    <span class="inline-block bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1.5 rounded-full mb-6">
      📢 매일 아침 찾아오는 내 사업 맞춤 공고
    </span>

    <h1 class="text-3xl md:text-5xl font-extrabold leading-tight tracking-tight text-gray-900 mb-6">
      정부지원사업 공고,<br>
      <span class="text-blue-600">카카오톡</span>으로 편하게 받아보세요
    </h1>

    <p class="text-base md:text-lg text-gray-600 mb-10 max-w-xl leading-relaxed">
      복잡한 공고 사이트를 매일 찾아다니지 마세요.<br>
      사업장 지역과 관심 분야에 딱 맞는 지원사업만 골라 보내드립니다.
    </p>

    <!-- 카카오 로그인 / 구독 신청 버튼 -->
    <div class="w-full max-w-sm flex flex-col gap-3">
      <button onclick="loginWithKakao()" class="w-full bg-[#FEE500] hover:bg-[#FADA0A] text-[#191919] font-bold py-4 px-6 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-lg">
        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
          <path d="M12 3c-4.97 0-9 3.185-9 7.115 0 2.557 1.707 4.8 4.27 6.09-.188.702-.682 2.545-.78 2.94-.122.494.181.487.38.356.157-.103 2.508-1.704 3.522-2.394.526.077 1.063.118 1.608.118 4.97 0 9-3.185 9-7.115S16.97 3 12 3z"/>
        </svg>
        카카오로 3초 만에 알림받기
      </button>
      <p class="text-xs text-gray-400 text-center">첫 달 무료 체험 이벤트 진행 중</p>
    </div>

    <!-- 키워드 가입 모달 (로그인 성공 후 표시) -->
    <div id="keyword-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
      <div class="bg-white rounded-2xl p-6 max-w-md w-full text-left shadow-xl">
        <h3 class="text-xl font-bold text-gray-900 mb-2">맞춤 키워드 설정</h3>
        <p class="text-sm text-gray-600 mb-4">원하시는 지역이나 사업 키워드를 쉼표(,)로 구분해 입력해 주세요.</p>
        
        <input type="text" id="user-keywords" placeholder="예: 부산, 소상공인, 마케팅, IT" class="w-full border border-gray-300 rounded-lg p-3 text-sm mb-4 focus:ring-2 focus:ring-blue-500 outline-none">
        
        <div class="flex gap-2">
          <button onclick="saveUserInfo()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">완료 및 알림 신청</button>
        </div>
      </div>
    </div>

  </main>

  <!-- 푸터 -->
  <footer class="w-full bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-400">
    <p>© 2026 비즈맵(Bizmap). All rights reserved.</p>
    <p class="mt-1">아이엠엘케이 | 문의: support@bizmap.co.kr</p>
  </footer>

  <!-- 연동 자바스크립트 로직 -->
  <script>
    // 1. Supabase 및 Kakao 키 설정 (발급된 키 적용 완료)
    const SUPABASE_URL = 'https://hcyvfgeaquydsvtrcnrv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_P19tdkj74ibIy7Xdle2i4w_M1B1mhV_';
    const KAKAO_JS_KEY = '9bd12d1c0e5ec843cafec8513fc92cc8';

    // 2. SDK 초기화
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    if (!Kakao.isInitialized()) {
      Kakao.init(KAKAO_JS_KEY);
    }

    let currentKakaoUser = null;

    // 3. 카카오 로그인 실행 함수
    function loginWithKakao() {
      Kakao.Auth.login({
        success: function(authObj) {
          Kakao.API.request({
            url: '/v2/user/me',
            success: function(res) {
              currentKakaoUser = res;
              // 키워드 입력 모달창 띄우기
              document.getElementById('keyword-modal').classList.remove('hidden');
            },
            fail: function(error) {
              alert('카카오 사용자 정보를 가져오는데 실패했습니다.');
            }
          });
        },
        fail: function(err) {
          alert('카카오 로그인에 실패했습니다.');
        }
      });
    }

    // 4. Supabase DB에 회원 데이터 저장 함수
    async function saveUserInfo() {
      const keywordsInput = document.getElementById('user-keywords').value;
      const keywordsList = keywordsInput.split(',').map(k => k.trim()).filter(k => k.length > 0);

      const email = currentKakaoUser.kakao_account?.email || `kakao_${currentKakaoUser.id}@bizmap.local`;
      const name = currentKakaoUser.properties?.nickname || '사용자';

      const { data, error } = await supabaseClient
        .from('users')
        .insert([
          { 
            email: email,
            name: name,
            keywords: keywordsList,
            provider: 'kakao',
            subscription_status: 'active'
          }
        ]);

      if (error) {
        console.error('DB 저장 에러:', error);
        alert('가입 처리 중 오류가 발생했습니다. (이미 가입된 계정일 수 있습니다)');
      } else {
        alert(`${name}님, 맞춤 알림 신청이 성공적으로 완료되었습니다!`);
        document.getElementById('keyword-modal').classList.add('hidden');
      }
    }
  </script>
</body>
</html>
